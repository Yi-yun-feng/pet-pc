<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JingShi Pet</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="layout">
      <div class="stage" id="stage">
        <div id="character" class="character">
          <div class="pet-eye pet-eye-left"></div>
          <div class="pet-eye pet-eye-right"></div>
          <div class="pet-mouth"></div>
          <div class="pet-blush pet-blush-left"></div>
          <div class="pet-blush pet-blush-right"></div>
        </div>
        <canvas id="live2d"></canvas>
        <div id="pet-name" class="pet-name">JingShi Pet</div>
      </div>

      <div class="chat">
        <div id="messages" class="messages"></div>
        <div class="input-row">
          <input id="input" type="text" placeholder="和角色说话…" maxlength="500" />
          <button id="send" type="button">发送</button>
        </div>
      </div>
    </div>
  </body>
</html>
